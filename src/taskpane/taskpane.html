<!-- Panel para crear evaluaciones basadas en PLANTILLA EVALUACION CSJ.dotx -->

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear Evaluación - CSJ</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- Fluent UI -->
    <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"/>

    <!-- Template styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m ms-Fabric">
    <header class="panel-header ms-bgColor-themeDark">
        <img width="60" height="60" src="../../assets/logo-filled.png" alt="CSJ" title="CSJ" />
        <h1 class="ms-font-xl ms-fontColor-white">Crear Nueva Evaluación</h1>
        <p class="ms-font-s ms-fontColor-white">Basada en PLANTILLA EVALUACION CSJ.dotx</p>
    </header>

    <main class="panel-content">
        <!-- Mensaje de sideload para desarrollo -->
        <section id="sideload-msg" class="ms-welcome__main">
            <h2 class="ms-font-xl">Please <a target="_blank" href="https://learn.microsoft.com/office/dev/add-ins/testing/test-debug-office-add-ins#sideload-an-office-add-in-for-testing">sideload</a> your add-in to see app body.</h2>
        </section>

        <!-- Formulario de creación de evaluación -->
        <div id="app-body" class="evaluation-form" style="display: none;">
            
            <div class="ms-Grid ms-Grid-row">
                <div class="ms-Grid-col ms-sm12">
                    <h2 class="ms-font-l ms-fontWeight-semibold ms-borderBottom-themePrimary ms-pb-s">
                        <i class="ms-Icon ms-Icon--FileComment"></i>
                        Datos de la Evaluación
                    </h2>
                </div>
            </div>

            <!-- Campo: Nombre de la evaluación -->
            <div class="ms-Grid ms-Grid-row ms-mb-m">
                <div class="ms-Grid-col ms-sm12">
                    <label class="ms-Label ms-fontWeight-semibold ms-mb-xs">
                        Nombre de la Evaluación *
                    </label>
                    <input 
                        type="text" 
                        id="eval-name" 
                        class="ms-TextField-field ms-TextField" 
                        placeholder="Ej: Prueba de Matemáticas - Unidad 1"
                        aria-label="Nombre de la evaluación"
                        required
                    />
                </div>
            </div>

            <!-- Campo: Objetivos -->
            <div class="ms-Grid ms-Grid-row ms-mb-m">
                <div class="ms-Grid-col ms-sm12">
                    <label class="ms-Label ms-fontWeight-semibold ms-mb-xs">
                        Objetivos de Aprendizaje *
                    </label>
                    <textarea 
                        id="eval-objectives" 
                        class="ms-TextField-field ms-TextField" 
                        placeholder="Describa los objetivos de aprendizaje que se evaluarán..."
                        rows="4"
                        aria-label="Objetivos de aprendizaje"
                        required
                    ></textarea>
                </div>
            </div>

            <!-- Campo: Curso -->
            <div class="ms-Grid ms-Grid-row ms-mb-m">
                <div class="ms-Grid-col ms-sm12">
                    <label class="ms-Label ms-fontWeight-semibold ms-mb-xs">
                        Curso *
                    </label>
                    <input 
                        type="text" 
                        id="eval-course" 
                        class="ms-TextField-field ms-TextField" 
                        placeholder="Ej: 5° Básico A"
                        aria-label="Curso"
                        required
                    />
                </div>
            </div>

            <!-- Campo: Fecha -->
            <div class="ms-Grid ms-Grid-row ms-mb-m">
                <div class="ms-Grid-col ms-sm12">
                    <label class="ms-Label ms-fontWeight-semibold ms-mb-xs">
                        Fecha *
                    </label>
                    <input 
                        type="date" 
                        id="eval-date" 
                        class="ms-TextField-field ms-TextField" 
                        aria-label="Fecha de la evaluación"
                        required
                    />
                </div>
            </div>

            <!-- Campo: Unidad -->
            <div class="ms-Grid ms-Grid-row ms-mb-m">
                <div class="ms-Grid-col ms-sm12">
                    <label class="ms-Label ms-fontWeight-semibold ms-mb-xs">
                        Unidad *
                    </label>
                    <input 
                        type="text" 
                        id="eval-unit" 
                        class="ms-TextField-field ms-TextField" 
                        placeholder="Ej: Unidad 1 - Números y Operaciones"
                        aria-label="Unidad"
                        required
                    />
                </div>
            </div>

            <!-- Campo: Tema a Evaluar -->
            <div class="ms-Grid ms-Grid-row ms-mb-m">
                <div class="ms-Grid-col ms-sm12">
                    <label class="ms-Label ms-fontWeight-semibold ms-mb-xs">
                        Tema a Evaluar *
                    </label>
                    <input 
                        type="text" 
                        id="eval-topic" 
                        class="ms-TextField-field ms-TextField" 
                        placeholder="Ej: Suma y resta de fracciones"
                        aria-label="Tema a evaluar"
                        required
                    />
                </div>
            </div>

            <!-- Botones de acción -->
            <div class="ms-Grid ms-Grid-row ms-mt-l ms-pb-l">
                <div class="ms-Grid-col ms-sm12">
                    <div class="form-actions">
                        <button 
                            id="btn-create-eval" 
                            class="ms-Button ms-Button--primary ms-Button--hero"
                        >
                            <span class="ms-Button-label">
                                <i class="ms-Icon ms-Icon--Plus"></i>
                                Crear Versión 1
                            </span>
                        </button>
                        <button 
                            id="btn-cancel" 
                            class="ms-Button ms-Button--default"
                        >
                            <span class="ms-Button-label">Cancelar</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Área de mensajes -->
            <div id="message-area" class="ms-Grid ms-Grid-row ms-mt-s" style="display: none;">
                <div class="ms-Grid-col ms-sm12">
                    <div id="message-content" class="ms-Callout-main"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- Script principal -->
    <script type="module" src="taskpane.js"></script>
</body>

</html>
